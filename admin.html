<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Krishi Saathi — Admin</title>
<style>
:root{--bg:#f5f1e7;--panel:#fffdf8;--ink:#1d2a20;--muted:#5d6a5e;--line:#e2dac8;--green:#2f6b3f;--green-l:#e3eee0;--soil:#8a5a2b;--soil-l:#f3e6d3;--danger:#b3412e}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}.sp{flex:1}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--green);color:#fff;border-color:var(--green)}
main{max-width:1000px;margin:0 auto;padding:20px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;font-weight:600;cursor:pointer}
.btn.p{background:var(--green);color:#fff;border-color:var(--green)}.btn.d{color:var(--danger)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.bar input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--panel)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:15px}.badge{align-self:flex-start;font-size:11px;font-weight:600;background:var(--green-l);color:var(--green);border-radius:99px;padding:2px 8px}
.card .b{font-size:13.5px;color:var(--muted);white-space:pre-wrap;max-height:7em;overflow:hidden}.off{opacity:.55}
.card .a{display:flex;gap:6px;margin-top:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font-size:26px;display:block}.stat span{font-size:12.5px;color:var(--muted)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}.sec h3{margin:0 0 10px;font-size:15px}
.row{display:grid;grid-template-columns:150px 1fr 40px;gap:8px;align-items:center;font-size:13px;margin:4px 0}
.tr{height:10px;border-radius:6px;background:#eee8da;overflow:hidden}.fi{height:100%;background:var(--green)}
.li{border:1px solid var(--line);border-radius:9px;padding:8px 10px;margin-bottom:8px;font-size:13.5px}.li small{color:var(--muted);display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}
.box{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:580px;max-height:92vh;overflow:auto}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}.box input,.box select,.box textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.box textarea{min-height:170px}.f{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
#login input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin:10px 0}
.msg{color:var(--danger);font-size:13px;min-height:1em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;display:none}
</style>
</head>
<body>
<div id="login">
  <h2 style="margin-top:0">Krishi Saathi admin</h2>
  <p style="color:var(--muted);margin:0">Enter the ADMIN_TOKEN set on the server.</p>
  <input type="password" id="tok" placeholder="Admin token" autocomplete="current-password">
  <div class="msg" id="lmsg"></div>
  <button class="btn p" id="go" style="width:100%">Sign in</button>
</div>

<div id="app" hidden>
  <header><h1>Krishi Saathi admin</h1><div class="tabs"><button data-t="kb" class="on">Knowledge base</button> <button data-t="ins">Insights</button></div><div class="sp"></div><button class="btn" id="out">Sign out</button></header>
  <main>
    <section id="kb">
      <div class="bar"><input type="search" id="q" placeholder="Search entries…"><button class="btn p" id="add">+ Add entry</button><button class="btn" id="imp" title="CSV columns: title, category, content, keywords">Import CSV</button><input type="file" id="csv" accept=".csv" hidden></div>
      <div class="cards" id="cards"></div>
    </section>
    <section id="ins" hidden>
      <div class="stats" id="stats"></div>
      <div class="sec"><h3>Languages used</h3><div id="langs"></div></div>
      <div class="sec"><h3>Top topics</h3><div id="topics"></div></div>
      <div class="sec"><h3>Questions the knowledge base didn't cover</h3><div id="gaps"></div></div>
      <div class="sec"><h3>Recent feedback</h3><div id="fb"></div></div>
    </section>
  </main>
</div>

<div class="modal" id="m"><div class="box">
  <h3 id="mt" style="margin-top:0">Add entry</h3>
  <label for="ft">Title</label><input id="ft" maxlength="200">
  <label for="fc">Category</label><select id="fc"></select>
  <label for="fx">Content</label><textarea id="fx"></textarea>
  <label for="fk">Keywords (any language, comma-separated)</label><input id="fk">
  <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="fa" style="width:auto"> Active (bot uses this entry)</label>
  <div class="f"><button class="btn" id="mc">Cancel</button><button class="btn p" id="ms">Save</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const CATS=["Natural farming inputs","Soil health","Crops & planning","Pests & diseases","Water & irrigation","Trees & agroforestry","Livestock","Programmes & events","Markets & FPOs","Other"];
const LN={en:"English",as:"Assamese",bn:"Bengali",brx:"Bodo",doi:"Dogri",gu:"Gujarati",hi:"Hindi",kn:"Kannada",ks:"Kashmiri",kok:"Konkani",mai:"Maithili",ml:"Malayalam",mni:"Manipuri",mr:"Marathi",ne:"Nepali",or:"Odia",pa:"Punjabi",sa:"Sanskrit",sat:"Santali",sd:"Sindhi",ta:"Tamil",te:"Telugu",ur:"Urdu"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let token=sessionStorage.getItem("ks_admin")||"", kb=[], editing=null;
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2500)}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",Authorization:"Bearer "+token,...(opts.headers||{})}});
  if(r.status===401){signOut();throw new Error("Unauthorised")}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j;
}
function signOut(){token="";sessionStorage.removeItem("ks_admin");$("app").hidden=true;$("login").hidden=false}
async function signIn(){token=$("tok").value.trim();try{await loadKb();sessionStorage.setItem("ks_admin",token);$("login").hidden=true;$("app").hidden=false}catch(e){$("lmsg").textContent="Wrong token or server not reachable."}}
async function loadKb(){kb=await api("/api/admin/kb");renderKb()}
function renderKb(){
  const q=$("q").value.trim().toLowerCase();
  const list=kb.filter(k=>!q||[k.title,k.category,k.content,k.keywords].join(" ").toLowerCase().includes(q));
  $("cards").innerHTML=list.length?list.map(k=>`<div class="card ${k.active?"":"off"}"><span class="badge">${esc(k.category)}${k.active?"":" · inactive"}</span><h3 dir="auto">${esc(k.title)}</h3><div class="b" dir="auto">${esc(k.content)}</div><div class="a"><button class="btn" data-e="${k.id}">Edit</button><button class="btn d" data-d="${k.id}">Delete</button></div></div>`).join(""):"<p>No entries.</p>";
  $("cards").querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>open(kb.find(k=>k.id===b.dataset.e)));
  $("cards").querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Confirm?";setTimeout(()=>{delete b.dataset.arm;b.textContent="Delete"},3000);return}await api("/api/admin/kb/"+b.dataset.d,{method:"DELETE"});toast("Deleted");loadKb()});
}
function open(k){editing=k||null;$("mt").textContent=k?"Edit entry":"Add entry";$("ft").value=k?.title||"";$("fc").value=k?.category||CATS[0];$("fx").value=k?.content||"";$("fk").value=k?.keywords||"";$("fa").checked=k?k.active:true;$("m").classList.add("on")}
async function save(){
  const body={title:$("ft").value,category:$("fc").value,content:$("fx").value,keywords:$("fk").value,active:$("fa").checked};
  try{await api(editing?"/api/admin/kb/"+editing.id:"/api/admin/kb",{method:editing?"PUT":"POST",body:JSON.stringify(body)});$("m").classList.remove("on");toast("Saved");loadKb()}catch(e){toast(e.message)}
}
function parseCsv(t){const rows=[];let r=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){r.push(f);f=""}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows.filter(x=>x.some(c=>c.trim()))}
async function importCsv(file){
  const rows=parseCsv(await file.text());const h=rows[0].map(x=>x.trim().toLowerCase());const ix=n=>h.indexOf(n);
  if(ix("title")<0||ix("content")<0){toast("CSV needs title and content columns");return}
  const entries=rows.slice(1).map(r=>({title:r[ix("title")],category:ix("category")>=0?r[ix("category")]:"Other",content:r[ix("content")],keywords:ix("keywords")>=0?r[ix("keywords")]:""}));
  try{const j=await api("/api/admin/kb/import",{method:"POST",body:JSON.stringify({entries})});toast("Imported "+j.imported);loadKb()}catch(e){toast(e.message)}
}
async function loadIns(){
  const d=await api("/api/admin/insights");const t=d.totals||{};const fb=(t.thumbs_up||0)+(t.thumbs_down||0);
  $("stats").innerHTML=[[t.answers,"Answers given"],[t.farmers,"Farmers / devices"],[t.gaps,"Knowledge gaps"],[fb?Math.round(t.thumbs_up*100/fb)+"%":"—",`Helpful (${t.thumbs_up||0}👍 / ${t.thumbs_down||0}👎)`],[t.kb_entries,"Active KB entries"]].map(([n,l])=>`<div class="stat"><b>${esc(n??0)}</b><span>${esc(l)}</span></div>`).join("");
  const bars=(rows,key,label)=>{const max=Math.max(1,...rows.map(r=>r.n));return rows.length?rows.map(r=>`<div class="row"><span>${esc(label(r[key]))}</span><div class="tr"><div class="fi" style="width:${r.n*100/max}%"></div></div><span>${r.n}</span></div>`).join(""):"<small>No data yet.</small>"};
  $("langs").innerHTML=bars(d.languages,"lang",k=>LN[k]||k);$("topics").innerHTML=bars(d.topics,"topic",k=>k);
  $("gaps").innerHTML=d.gaps.length?d.gaps.map(g=>`<div class="li" dir="auto">${esc(g.question)}<small>${esc(g.topic||"")} · ${esc(LN[g.lang]||g.lang||"")} · ${new Date(g.created_at).toLocaleString()}</small></div>`).join(""):"<small>None yet.</small>";
  $("fb").innerHTML=d.feedback.length?d.feedback.map(f=>`<div class="li" dir="auto">${f.rating>0?"👍":"👎"} <b>${esc(f.question||"")}</b><small>${esc((f.content||"").slice(0,240))}</small></div>`).join(""):"<small>None yet.</small>";
}
$("fc").innerHTML=CATS.map(c=>`<option>${esc(c)}</option>`).join("");
$("go").onclick=signIn;$("tok").onkeydown=e=>{if(e.key==="Enter")signIn()};$("out").onclick=signOut;
$("q").oninput=renderKb;$("add").onclick=()=>open(null);$("mc").onclick=()=>$("m").classList.remove("on");$("ms").onclick=save;
$("imp").onclick=()=>$("csv").click();$("csv").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)importCsv(f)};
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x===b));$("kb").hidden=b.dataset.t!=="kb";$("ins").hidden=b.dataset.t!=="ins";if(b.dataset.t==="ins")loadIns().catch(e=>toast(e.message))});
if(token){loadKb().then(()=>{$("login").hidden=true;$("app").hidden=false}).catch(()=>{})}
</script>
</body>
</html>
